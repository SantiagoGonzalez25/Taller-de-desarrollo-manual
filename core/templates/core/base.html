{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Gestión de eventos{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'core/estilos.css' %}">
</head>

<body>
    <header class="cabecera">
        <div class="contenedor">
            <a class="marca" href="{% url 'eventos:lista' %}">Gestión de eventos</a>
            <nav class="menu">
                <a href="{% url 'eventos:lista' %}">Eventos</a>
                <a href="{% url 'confirmacion:confirmar' %}">Confirmar asistencia</a>
            </nav>
        </div>
    </header>
    <main class="contenedor contenido">
        {% block contenido %}{% endblock %}
    </main>
    <footer class="pie">Proyecto didáctico con Django</footer>
</body>

</html>
